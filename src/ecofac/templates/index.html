<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFac — Open Energy Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#10b981',
                        surface: '#1e293b',
                        background: '#0f172a',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <nav class="glass px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-full bg-brand flex items-center justify-center font-bold text-background">E</div>
            <h1 class="text-xl font-bold tracking-wider">EcoFac <span class="text-brand font-normal">Intelligence</span></h1>
        </div>
        <div class="flex space-x-4">
            <button onclick="generateDemo(this)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-md text-sm font-medium transition">Generate Demo Data</button>
        </div>
    </nav>

    <main class="flex-grow p-6 grid grid-cols-1 md:grid-cols-4 gap-6 max-w-7xl mx-auto w-full">
        
        <div class="glass rounded-xl p-6 flex flex-col justify-between">
            <span class="text-slate-400 text-sm uppercase tracking-wider">Buildings</span>
            <span id="stat-buildings" class="text-4xl font-bold mt-2">-</span>
        </div>
        <div class="glass rounded-xl p-6 flex flex-col justify-between">
            <span class="text-slate-400 text-sm uppercase tracking-wider">Meters</span>
            <span id="stat-meters" class="text-4xl font-bold mt-2">-</span>
        </div>
        <div class="glass rounded-xl p-6 flex flex-col justify-between border-l-4 border-yellow-500">
            <span class="text-slate-400 text-sm uppercase tracking-wider">Open Incidents</span>
            <span id="stat-open" class="text-4xl font-bold mt-2 text-yellow-400">-</span>
        </div>
        <div class="glass rounded-xl p-6 flex flex-col justify-between">
            <span class="text-slate-400 text-sm uppercase tracking-wider">Total Incidents</span>
            <span id="stat-total" class="text-4xl font-bold mt-2">-</span>
        </div>

        <div class="glass rounded-xl p-6 md:col-span-3">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Recent Energy Consumption (Last 24h)</h2>
            <div class="h-72">
                <canvas id="energyChart"></canvas>
            </div>
        </div>

        <div class="glass rounded-xl p-6 flex flex-col">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Data Ingestion</h2>
            <div class="border-2 border-dashed border-slate-600 rounded-xl p-4 text-center flex-grow flex flex-col justify-center items-center hover:border-brand transition cursor-pointer" onclick="document.getElementById('fileInput').click()">
                <svg class="w-10 h-10 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <span class="text-sm text-slate-400">Click to upload CSV</span>
                <input type="file" id="fileInput" class="hidden" accept=".csv" onchange="uploadCSV(this)">
            </div>
            <div id="upload-status" class="mt-4 text-sm text-center text-brand hidden">Uploading...</div>
        </div>

        <div class="glass rounded-xl p-6 md:col-span-4 overflow-hidden">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Recent Incidents</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="pb-3 pr-4">Incident ID</th>
                            <th class="pb-3 pr-4">Status</th>
                            <th class="pb-3 pr-4">Created At</th>
                            <th class="pb-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="incidents-table" class="divide-y divide-slate-700/50">
                        <tr><td colspan="4" class="py-4 text-center text-slate-500">Loading incidents...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        let chartInstance = null;

        // Read a response safely: the server may return plain text (e.g. on a 500), not JSON.
        async function readBody(res) {
            const text = await res.text();
            try { return JSON.parse(text); } catch (e) { return { detail: text || res.statusText }; }
        }

        function errorMessage(res, body) {
            let detail = body && body.detail;
            if (detail && typeof detail !== 'string') { detail = JSON.stringify(detail); }
            return `HTTP ${res.status}: ${detail || 'Request failed'}`;
        }

        async function fetchStats() {
            const res = await fetch('/api/v1/dashboard/stats');
            if (!res.ok) { console.error('stats failed', res.status); return; }
            const data = await res.json();
            document.getElementById('stat-buildings').innerText = data.buildings;
            document.getElementById('stat-meters').innerText = data.meters;
            document.getElementById('stat-open').innerText = data.open_incidents;
            document.getElementById('stat-total').innerText = data.total_incidents;
        }

        async function fetchChart() {
            const res = await fetch('/api/v1/dashboard/chart-data');
            if (!res.ok) { console.error('chart-data failed', res.status); return; }
            const data = await res.json();
            
            const ctx = document.getElementById('energyChart').getContext('2d');
            
            if (chartInstance) { chartInstance.destroy(); }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Consumption (kWh)',
                        data: data.data,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        async function fetchIncidents() {
            const res = await fetch('/api/v1/incidents?limit=10');
            if (!res.ok) { console.error('incidents failed', res.status); return; }
            const incidents = await res.json();
            const tbody = document.getElementById('incidents-table');
            
            if (incidents.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-slate-500">No incidents found. Generate demo data first.</td></tr>';
                return;
            }

            tbody.innerHTML = incidents.map(inc => `
                <tr class="hover:bg-slate-800/50 transition">
                    <td class="py-3 pr-4 font-mono text-xs text-slate-400">${inc.id.slice(0,8)}...</td>
                    <td class="py-3 pr-4">
                        <span class="px-2 py-1 rounded-full text-xs font-semibold ${inc.status === 'DETECTED' ? 'bg-red-500/20 text-red-400' : 'bg-yellow-500/20 text-yellow-400'}">
                            ${inc.status}
                        </span>
                    </td>
                    <td class="py-3 pr-4 text-slate-400">${new Date(inc.created_at).toLocaleString()}</td>
                    <td class="py-3 space-x-2">
                        ${inc.status === 'DETECTED' ? `<button onclick="transitionIncident('${inc.id}', 'review')" class="text-brand hover:underline text-xs">Review</button>` : ''}
                        ${inc.status === 'UNDER_REVIEW' ? `<button onclick="transitionIncident('${inc.id}', 'acknowledge')" class="text-brand hover:underline text-xs">Acknowledge</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        async function transitionIncident(id, action) {
            await fetch(`/api/v1/incidents/${id}/${action}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({reason: 'Actioned via dashboard'})
            });
            fetchIncidents();
            fetchStats();
        }

        async function generateDemo(btn) {
            btn.innerText = "Generating & Ingesting...";
            btn.disabled = true;
            try {
                const res = await fetch('/api/v1/dashboard/generate-demo', {method: 'POST'});
                const data = await readBody(res);
                if (res.ok) {
                    alert(data.message || "Demo data generated.");
                    fetchStats();
                    fetchChart();
                    fetchIncidents();
                } else {
                    alert("Error: " + errorMessage(res, data));
                }
            } catch (e) {
                alert("Could not reach the server: " + e.message);
            } finally {
                btn.innerText = "Generate Demo Data";
                btn.disabled = false;
            }
        }

        async function uploadCSV(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            
            const formData = new FormData();
            formData.append("file", file);
            formData.append("source_id", "dashboard-upload");
            formData.append("batch_id", "batch-" + Date.now());

            const statusDiv = document.getElementById('upload-status');
            statusDiv.innerText = "Uploading and processing...";
            statusDiv.classList.remove('hidden');

            statusDiv.className = "mt-4 text-sm text-center text-slate-400";
            try {
                const res = await fetch('/api/v1/imports', {
                    method: 'POST',
                    body: formData
                });
                const data = await readBody(res);

                if (res.ok) {
                    statusDiv.innerText = `Success! Accepted: ${data.accepted_rows}, Rejected: ${data.rejected_rows}`;
                    statusDiv.className = "mt-4 text-sm text-center text-brand";
                    fetchStats();
                    fetchChart();
                    fetchIncidents();
                } else {
                    statusDiv.innerText = `Error: ${errorMessage(res, data)}`;
                    statusDiv.className = "mt-4 text-sm text-center text-red-400";
                }
            } catch (e) {
                statusDiv.innerText = "Network error: could not reach the server.";
                statusDiv.className = "mt-4 text-sm text-center text-red-400";
            } finally {
                input.value = "";  // allow re-selecting the same file
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchStats();
            fetchChart();
            fetchIncidents();
            setInterval(fetchStats, 10000);
        });
    </script>
</body>
</html>
