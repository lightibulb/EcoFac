<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EcoFac Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{--bg:#0e1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--accent:#3fb950;--warn:#d29922;--bad:#f85149;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);}
  header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d;}
  h1{font-size:18px;margin:0;}
  .sub{color:var(--muted);font-size:12px;}
  main{padding:24px;display:grid;gap:16px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
  .card{background:var(--card);border:1px solid #30363d;border-radius:8px;padding:14px;}
  .card .label{color:var(--muted);font-size:12px;}
  .card .value{font-size:22px;font-weight:600;margin-top:4px;}
  .panel{background:var(--card);border:1px solid #30363d;border-radius:8px;padding:16px;}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .grow{flex:1 1 400px;}
  select{background:#0d1117;color:var(--text);border:1px solid #30363d;border-radius:6px;padding:6px 10px;}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;margin:2px;border:1px solid #30363d;}
  #status{font-size:12px;}
  .ok{color:var(--accent);} .bad{color:var(--bad);}
</style>
</head>
<body>
<header>
  <div>
    <h1>EcoFac — Live Energy Dashboard</h1>
    <div class="sub">Synthetic data · GitHub-native · no local storage</div>
  </div>
  <div id="status">loading…</div>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="panel">
    <div class="row" style="align-items:center;justify-content:space-between;">
      <strong>Consumption (kWh)</strong>
      <select id="meterSelect"></select>
    </div>
    <canvas id="chart" height="120"></canvas>
  </div>
  <div class="row">
    <div class="panel grow"><strong>Incidents by status</strong><div id="incidents"></div></div>
    <div class="panel grow"><strong>Data quality flags</strong><div id="quality"></div></div>
  </div>
</main>
<script>
const DATA_URL="data.json";
let chart=null,snapshot=null;
const el=id=>document.getElementById(id);
const fmt=n=>(n===undefined||n===null)?"–":n;

async function load(){
  try{
    const r=await fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    snapshot=await r.json();
    render();
    el("status").textContent="updated "+snapshot.generated_at;
    el("status").className="ok";
  }catch(e){
    el("status").textContent="failed: "+e.message;
    el("status").className="bad";
  }
}
function render(){
  const m=snapshot.detection_metrics||{},ing=snapshot.ingestion||{};
  const cards=[["Precision",fmt(m.precision)],["Recall",fmt(m.recall)],["F1",fmt(m.f1)],
    ["True Positives",fmt(m.true_positives)],["False Positives",fmt(m.false_positives)],
    ["Rows Ingested",fmt(ing.accepted)],["Anomalies",fmt((snapshot.anomalies||[]).length)]];
  el("cards").innerHTML=cards.map(([l,v])=>
    `<div class="card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("");
  const meters=Object.keys(snapshot.series||{}),sel=el("meterSelect"),cur=sel.value;
  sel.innerHTML=meters.map(x=>`<option value="${x}">${x}</option>`).join("");
  if(cur&&meters.includes(cur))sel.value=cur;
  sel.onchange=drawChart;
  drawChart();
  const inc=snapshot.incidents_by_status||{};
  el("incidents").innerHTML=Object.keys(inc).length
    ?Object.entries(inc).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join("")
    :`<span class="sub">none</span>`;
  const q=snapshot.quality_metrics||{};
  el("quality").innerHTML=Object.entries(q).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join("");
}
function drawChart(){
  const meter=el("meterSelect").value;
  const series=(snapshot.series||{})[meter]||[];
  const labels=series.map(p=>p.t.slice(5,16).replace("T"," "));
  const values=series.map(p=>p.v);
  const anomalies=(snapshot.anomalies||[]).filter(a=>a.meter_id===meter);
  const anomPoints=series.map(p=>anomalies.some(a=>a.t===p.t)?p.v:null);
  const ctx=el("chart").getContext("2d");
  if(chart)chart.destroy();
  chart=new Chart(ctx,{
    data:{labels,datasets:[
      {type:"line",label:meter+" kWh",data:values,borderColor:"#3fb950",
       backgroundColor:"rgba(63,185,80,0.1)",pointRadius:0,tension:0.2,fill:true},
      {type:"scatter",label:"anomaly",data:anomPoints,pointRadius:5,pointStyle:"triangle",
       showLine:false,borderColor:"#f85149",backgroundColor:"#f85149"}]},
    options:{responsive:true,
      plugins:{legend:{labels:{color:"#e6edf3"}}},
      scales:{x:{ticks:{color:"#8b949e",maxTicksLimit:12},grid:{color:"#21262d"}},
              y:{ticks:{color:"#8b949e"},grid:{color:"#21262d"}}}}
  });
}
load();
setInterval(load,30000); // poll every 30s
</script>
</body>
</html>
