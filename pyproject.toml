[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecofac"
version = "0.1.0"
description = "Open Energy Intelligence for Facilities (synthetic data only)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn",
    "python-multipart",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx",
    "ruff>=0.8",
]

# Use setuptools' automatic package discovery
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ecofac*", "simulator*", "evaluation*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
ecofac = ["templates/*.html", "static/*", "persistence/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D", "COM812", "ISC001", "ANN401", "CPY", "INP", "PLR0913", 
    "TRY301", "S608", "PTH123", "T201", "PLR2004", "S311", "B008",
    "C901", "PLR0912", "PLR0915", "PLR0917", "TRY003", "EM101",
]

[tool.ruff.lint.isort]
known-first-party = ["ecofac", "evaluation", "simulator"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ANN", "D", "E501"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow", "integration"]
