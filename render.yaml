services:
  - type: web
    name: ecofac
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn ecofac.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Free plan: no persistent disk, so the SQLite file (default ecofac_api.db)
    # is rebuilt after every redeploy or spin-down. For durable data, switch to
    # a paid plan, add a `disk:` mounted at /opt/render/data, and set
    # ECOFAC_DB_PATH=/opt/render/data/ecofac_api.db.
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.17"
